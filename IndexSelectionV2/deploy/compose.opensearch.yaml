# Local OpenSearch for the text index (docs/TEXT_INDEX.md): a laptop or a test run, not
# Host2. Security is off and the port is bound to loopback. A Host2 deployment needs
# the security plugin, TLS and credentials passed as secrets, and a heap of 16-31 GB.
#   OS_HEAP=3g docker compose -f deploy/compose.opensearch.yaml up -d --build
name: isel-opensearch

services:
  opensearch:
    build: opensearch
    image: isel-opensearch:3.9.0
    environment:
      discovery.type: single-node
      DISABLE_SECURITY_PLUGIN: "true"
      DISABLE_INSTALL_DEMO_CONFIG: "true"
      bootstrap.memory_lock: "true"
      OPENSEARCH_JAVA_OPTS: "-Xms${OS_HEAP:-3g} -Xmx${OS_HEAP:-3g}"
    ulimits:
      memlock: {soft: -1, hard: -1}
      nofile: {soft: 65536, hard: 65536}
    ports:
      - "127.0.0.1:9200:9200"
    volumes:
      - data:/usr/share/opensearch/data
    mem_limit: 7g
    restart: "no"

volumes:
  data:
