# Index selection: every tunable lives here. Loading rejects unknown keys,
# missing keys and wrong types. Host-specific values go into an overlay file
# passed as a second --config (see config/container.toml).

[run]
work_dir = "work"
app_name = "isel"                        # application_name prefix on every DB session

[guard]                                  # checked before every crawlerdb and metricdb statement (UTC)
month_days = [1, 16]                     # golden creation and measurement days
month_window = ["00:00", "20:00"]
hourly_window = [58, 10]                 # minutes; wraps past the hour. The metric hourly scan
                                         # ran :00-:07 (2026-10-11); statements end before :58
max_io_waiters = 15                      # active backends waiting on IO; hourly scan hits 25-37
probes = 3                               # median of this many pg_stat_activity readings
probe_interval_s = 1.0
probe_ttl_s = 30.0                       # reuse a reading this fresh
pause_s = 60.0                           # wait after a high reading
min_mb_s = 5.0                           # assumed worst-case heap read speed
timeout_floor_s = 120
timeout_cap_s = 900                      # must stay below the 48-minute hourly open gap

[crawlerdb]
dsn_env = "ISEL_CRAWLERDB_DSN"           # DSNs live only in the environment
connect_timeout_s = 10
num_shards = 256
url_table_fmt = "url_state_current_{:03d}"
split_table = "shard_split_subdomain"

[crawlerdb.session]                      # applied at connect; the role is a superuser
default_transaction_read_only = "on"
standard_conforming_strings = "on"       # the SQL gate lexes strings with this quoting
statement_timeout = "120s"
lock_timeout = "1s"
idle_in_transaction_session_timeout = "60s"
temp_file_limit = "0"                    # never spill on the full /data disk
datestyle = "ISO"                        # these three fix the CSV text pull-full parses
extra_float_digits = "1"                 # shortest exact float8 text
client_encoding = "UTF8"
max_parallel_workers_per_gather = "0"
jit = "off"
work_mem = "16MB"

[metricdb]
dsn_env = "ISEL_METRICDB_DSN"
connect_timeout_s = 10

[metricdb.session]
default_transaction_read_only = "on"
standard_conforming_strings = "on"
statement_timeout = "120s"
lock_timeout = "1s"

[routing]                                # mirrors WebCrawler ingest.yaml domain_overrides
tldextract_offline = true

[routing.overrides]
"wikipedia.org" = 0
"x.com" = 32
"youtube.com" = 64
"reddit.com" = 96
"instagram.com" = 128
"espn.com" = 160
"facebook.com" = 192
"yahoo.com" = 224

[pull]
min_interval_s = 0.5                     # minimum gap between crawlerdb statements
shards = []                              # empty = all shards

[golden]
lead_h = 30.0                            # as_of = batch created_at - lead_h
tags = ["head", "random"]
exclude_batches = []

[features]
half_life_days = 90.0                    # decay of older batches in golden-derived features
eb_pseudo_hits = 1.0                     # Beta-binomial prior strength, in golden hits
url_len_cap = 200
path_markers = ["/wiki/", "/watch", "/video", "/news", "/article", "/story", "/reel",
                "/status/", "/comments/", "/p/", "/tag/", "/search", "/@"]
date_regex = "/(19|20)[0-9]{2}[/-](0[1-9]|1[0-2])([/-](0[1-9]|[12][0-9]|3[01]))?"
ext_classes = { html = 1, htm = 1, php = 2, asp = 3, aspx = 3, jsp = 3, pdf = 4 }

[features.sets]
full = [
  "url_len", "path_depth", "is_root", "has_query", "n_params", "path_long_number",
  "path_date", "path_marker", "ext_class", "is_https", "sub_www", "sub_mobile", "sub_amp",
  "host_labels",
  "title_null", "title_len", "has_anchor", "discovery_source_type", "robots_bits",
  "is_redirect", "redirect_hop_count", "has_json_ld", "hreflang_count", "has_last_modified",
  "has_cache_control", "fetch_age_days",
  "log_inlinks", "log_ext", "has_ext", "rel_inlinks", "rel_ext",
  "hist_decayed", "hist_head", "hist_random", "hist_days_since",
  "lift_tld", "lift_dkey", "lift_host", "lift_hp", "dem_dkey", "dem_host",
  "log_size_dkey", "log_size_host", "dkey_ext_share", "history_batches",
]
no_inlinks = [
  "url_len", "path_depth", "is_root", "has_query", "n_params", "path_long_number",
  "path_date", "path_marker", "ext_class", "is_https", "sub_www", "sub_mobile", "sub_amp",
  "host_labels",
  "title_null", "title_len", "has_anchor", "discovery_source_type", "robots_bits",
  "is_redirect", "redirect_hop_count", "has_json_ld", "hreflang_count", "has_last_modified",
  "has_cache_control", "fetch_age_days",
  "hist_decayed", "hist_head", "hist_random", "hist_days_since",
  "lift_tld", "lift_dkey", "lift_host", "lift_hp", "dem_dkey", "dem_host",
  "log_size_dkey", "log_size_host", "dkey_ext_share", "history_batches",
]
no_domain = [
  "url_len", "path_depth", "is_root", "has_query", "n_params", "path_long_number",
  "path_date", "path_marker", "ext_class", "is_https", "sub_www", "sub_mobile", "sub_amp",
  "host_labels",
  "title_null", "title_len", "has_anchor", "discovery_source_type", "robots_bits",
  "is_redirect", "redirect_hop_count", "has_json_ld", "hreflang_count", "has_last_modified",
  "has_cache_control", "fetch_age_days",
  "log_inlinks", "log_ext", "has_ext",
  "hist_decayed", "hist_head", "hist_random", "hist_days_since",
]
no_history = [
  "url_len", "path_depth", "is_root", "has_query", "n_params", "path_long_number",
  "path_date", "path_marker", "ext_class", "is_https", "sub_www", "sub_mobile", "sub_amp",
  "host_labels",
  "title_null", "title_len", "has_anchor", "discovery_source_type", "robots_bits",
  "is_redirect", "redirect_hop_count", "has_json_ld", "hreflang_count", "has_last_modified",
  "has_cache_control", "fetch_age_days",
  "log_inlinks", "log_ext", "has_ext", "rel_inlinks", "rel_ext",
  "lift_tld", "lift_dkey", "lift_host", "lift_hp", "dem_dkey", "dem_host",
  "log_size_dkey", "log_size_host", "dkey_ext_share", "history_batches",
]
# Replica of V1 (PR #4): URL-string features plus a golden-derived domain frequency.
v1_features = [
  "url_len", "path_depth", "is_root", "has_query", "n_params", "path_long_number",
  "path_date", "path_marker", "ext_class", "is_https", "sub_www", "sub_mobile", "sub_amp",
  "host_labels", "dem_dkey",
]

[dataset]
neg_rate = 0.1                           # q: share of sample rows kept as negatives
neg_salt = "isel"
first_label_batch = 2                    # batch 1 only feeds history

[model]
feature_set = "full"
num_boost_round = 3000
early_stopping_rounds = 100
refit_on_all = true                      # refit on all training batches with the best rounds
logreg_c = 1.0
logreg_max_iter = 500

[model.params]                           # passed to lightgbm.train as-is
objective = "binary"
metric = "binary_logloss"
learning_rate = 0.05
num_leaves = 63
min_data_in_leaf = 200
feature_fraction = 0.8
bagging_fraction = 0.8
bagging_freq = 1
lambda_l2 = 1.0
max_bin = 255
cat_smooth = 10.0
num_threads = 8
seed = 7
deterministic = true
force_row_wise = true
verbose = -1

[eval]
test_batches = [6, 7, 8, 18, 19]
k_values = [32000000, 64000000, 128000000]
k_headline = 128000000
fractions = [0.019, 0.039, 0.077]        # K as a share of the pool at each batch's as_of
gain_curve_k = [1000000, 2000000, 4000000, 8000000, 16000000, 32000000, 64000000,
                128000000, 256000000, 512000000]
bootstrap_samples = 1000
bootstrap_seed = 12345
baselines = ["random", "inlinks", "ext", "domain_prior", "logreg", "v1_features"]
importance_top_n = 15                    # gain importances kept per model in results

[eval.v2_formula]                        # V2 baseline_v1, for forward-only comparison
inlinks_cap = 10000.0
ext_cap = 1000.0
prior_cap = 200.0
w_inlinks = 1.0
w_ext = 1.0
w_url = 1.0
w_prior = 2.0

[manifest]
schema_version = 2                       # 2: host and domain_id replace domain_key
index_shards = 16                        # index_shard = doc_id mod index_shards
reason_top_n = 3                         # top feature contributions kept per row
canonical_workers = 1                    # processes running canonicalize over the URLs
canonical_batch_rows = 1000000           # URLs per canonicalize task

[duckdb]
threads = 8
memory_limit = "16GB"
max_temp_directory_size = "50GB"

[full]                                   # full crawled pool: export, score, exact top-K
chunk_blocks = 65536                     # heap blocks per COPY (512 MiB); its timeout is the 120 s floor
chunks_per_file = 16                     # COPY chunks per Parquet file (8 GiB of heap), the resume unit
min_free_gb = 150.0                      # stop exporting below this much free work_dir disk
tau_margin = 0.15                        # score floor = sample score at rank round(K·p·(1 + margin))
parse_threads = 8                        # pyarrow threads that parse the CSV COPY output
connections = 4                          # crawlerdb sessions, one backend core each (Host1: 144)
max_heap_mb_s = 2000.0                   # heap read cap for all sessions together; the hourly
                                         # metric scan reads 7-8 GB/s with await < 1 ms
sample_percent = 2.0                     # derive-sample keeps rows whose salted URL hash is below it
sample_salt = "sample-v1"                # changing it draws a different sample
agg_share = 0.5                          # share of the sample that only feeds domain statistics;
                                         # the rest gives negatives, the eval pool and tau
agg_salt = "agg-v1"                      # splits the sample into those two halves
kept_share_max_z = 6.0                   # score-full stops when its kept rows differ from
                                         # the sample's estimate by more than this many SDs

[selectdb]                               # OUR selectdb (:5445), the only database isel writes
admin_dsn_env = "ISEL_SELECTDB_ADMIN_DSN"
reader_dsn_env = "ISEL_SELECTDB_READER_DSN"        # the role the official metric connects as
reader_role = "select"                   # WebSearchEngine measure.py hardcodes this user
reader_password_env = "ISEL_SELECTDB_READER_PASSWORD"   # only init-selectdb needs it
forbidden_ports = [5432, 5433, 5444]     # crawlerdb, metricdb, V1 selectdb
connect_timeout_s = 10
copy_block_bytes = 8388608
maintenance_work_mem = "4GB"             # primary key build on 128M URLs
swap_lock_timeout = "5s"                 # readers wait at most this long for a swap
swap_retry_attempts = 5
swap_retry_backoff_s = 30.0
keep_prev = true                         # keep the previous list for rollback
max_db_bytes = 200000000000              # refuse a load that would grow selectdb past this
est_bytes_per_row = 230                  # heap + primary key per selected URL
verify_chunk = 10000                     # URLs per lookup, as in the official metric

[schedule]                               # the metric reads the list right after creating a batch
swap_freeze_days = [1, 16]
swap_freeze_window = ["11:30", "20:00"]  # random set at 12:00, head set at 18:00 UTC

[recrawl]                                # recrawl frontier in selectdb `recrawl`; docs/RECRAWL.md
api_url = "http://127.0.0.1:4000/scheduler_ingest"   # crawler API (proposal C10), via the gateway
api_token_env = "ISEL_RECRAWL_API_TOKEN" # bearer token for the recrawl-batches routes
api_timeout_s = 10.0
result_root = "work/recrawl/result"      # crawler_NN/<base>.{warc.gz,jsonl}; read-only for isel
text_root = "work/recrawl/text"          # permanent extracted text, fetch_date=YYYYMMDD/crawler_NN/
log_root = "work/recrawl/log"            # permanent gzipped fetch logs, YYYYMMDD/crawler_NN/
crawler_processes = 16                   # crawler processes; a host goes to shard // (256 / 16)
batch_size = 100                         # URLs per batch, as the offerer's per_domain_url_cap
plan_max_batches = 1000                  # batches sent per plan cycle
queue_files_per_dir = 384                # C10 answers 429 above this many batches per process
plan_interval_s = 30.0
api_backoff_s = 300.0                    # no new batches after the API refused the whole cycle
dispatch_timeout_s = 28800               # after the crawler takes a batch: 100 URLs at a 60 s
                                         # Crawl-delay and share_min 0.25 take 24000 s
sweep_rows = 100000                      # fetched docs made due again per plan cycle
stale_days = 30                          # uniform revisit interval
retry_base_s = 600                       # failed doc: retry_base_s * 2^attempts
retry_max_s = 86400
max_attempts = 5                         # then wait stale_days instead of retry_max_s
robots_retry_days = 30                   # a robots.txt disallow is asked again after this
host_pause_max_s = 86400                 # cap on a 429/503 Retry-After pause
archive_interval_s = 60.0
archive_workers = 8                      # text extraction: 6.5 ms per 590 KB page each
min_free_gb = 800                        # no new batches below this free space under text_root;
                                         # Host2 /data has ~2 TB free while the crawler runs
result_cap_gb = 1000                     # no new batches while recrawl_result holds more than this
max_body_chars = 200000                  # extracted body text kept per page
sync_chunk_rows = 1000000                # docs per recrawl-sync transaction
# Pacing: each batch asks the crawler for the share of its host's requests that
# finishes the host's due docs within pace_days of the oldest one (proposal C9).
pace_days = 14.0
pace_cycle_s = 6.7                       # seconds per request on a host: max(gap, latency)
share_min = 0.25                         # a 100-URL batch at pace_cycle_s then takes ~45 min
share_max = 0.75                         # the normal lane keeps at least 25 % of a busy host
min_gap_s = 5.0                          # 0.2 qps per hostname; capacity report only
report_days = [1, 7, 14, 28]             # capacity report horizons
