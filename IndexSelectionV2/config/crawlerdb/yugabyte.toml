# crawlerdb on YugabyteDB (YSQL). Layer it after the base config:
#   isel --config config/isel.toml --config config/crawlerdb/yugabyte.toml pull-full
# The DSN may list every node, e.g. "host=a,b,c port=5433 ... load_balance_hosts=random",
# so the sessions spread over the tservers.

[crawlerdb]
engine = "yugabyte"
dsn_env = "ISEL_CRAWLERDB_YB_DSN"

[crawlerdb.session]
# Read-only transactions read a replica as of 30 s ago (yb_follower_read_staleness_ms),
# older than any clock skew, so a COPY cannot hit a read restart error, and the
# scan spreads over all three replicas instead of only the leaders.
yb_read_from_followers = "on"

[full]
connections = 3                          # one session per tserver
chunks_per_file = 4                      # 16 hash chunks per shard: four files, the resume unit
