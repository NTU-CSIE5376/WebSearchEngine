[project]
name = "idxsel"
version = "0.1.0"
description = "Index Selection V2: biweekly selection of crawled URLs into selectdb"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.5.6",
    "psycopg[binary]>=3.3.6",
    "pyarrow>=25.0.1",
    "python-json-logger>=4.2.0",
    "tldextract==5.1.1",
    "w3lib>=2.5.0",
]

[project.scripts]
idxsel = "idxsel.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/idxsel"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "D", "SIM", "RUF"]
ignore = ["D100", "D101", "D102", "D103", "D104", "D105", "D106", "D107", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: needs a local Docker daemon with the postgres:16 image"]
addopts = "-m 'not integration'"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]
